<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15" />
      <stop offset="50%" stop-color="#0C1527" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="azure-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="aws-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF9900" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="tf-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#844FBA" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#844FBA" stop-opacity="0" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Cyan/Blue Text Gradient -->
    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Glassmorphism Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38BDF8" fill-opacity="0.3" />
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 46px; font-weight: 800; letter-spacing: -0.5px; }
    .subtitle { font-size: 19px; font-weight: 600; letter-spacing: 0.2px; }
    .badge-text { font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }
    .metric-value { font-size: 20px; font-weight: 700; }
    .metric-label { font-size: 11px; font-weight: 500; fill: #94A3B8; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="220" fill="url(#azure-glow)" />
  <circle cx="1050" cy="300" r="260" fill="url(#aws-glow)" />
  <circle cx="650" cy="180" r="180" fill="url(#tf-glow)" />

  <!-- Decorative Border -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- ================= LEFT COLUMN: HERO CONTENT ================= -->

  <!-- Top Pill Badge -->
  <g transform="translate(60, 42)">
    <rect width="320" height="28" rx="14" fill="#0369A1" fill-opacity="0.25" stroke="#0284C7" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="14" cy="14" r="4" fill="#38BDF8" />
    <text x="28" y="18" fill="#38BDF8" class="font-main badge-text">ENTERPRISE CLOUD ARCHITECTURE &amp; STRATEGY</text>
  </g>

  <!-- Name -->
  <text x="60" y="125" fill="url(#title-grad)" class="font-main title">RANJAN BHARDWAJ</text>

  <!-- Role Subtitle -->
  <text x="60" y="162" fill="url(#sub-grad)" class="font-main subtitle">Cloud Solutions Architect | Enterprise Strategy &amp; DevSecOps</text>

  <!-- Description / Core Strengths -->
  <text x="60" y="195" fill="#94A3B8" class="font-main" font-size="14px" font-weight="400">
    Azure Landing Zones (CAF) • Multi-Cloud (Azure &amp; AWS) • Modular Terraform • 4-Tier Zero Trust
  </text>

  <!-- Skill Pill Tags -->
  <g transform="translate(60, 222)">
    <!-- Tag 1: Azure -->
    <g transform="translate(0, 0)">
      <rect width="120" height="28" rx="6" fill="#1E293B" stroke="#0078D4" stroke-width="1.2" />
      <text x="60" y="18" fill="#E2E8F0" class="font-main badge-text" text-anchor="middle">Azure (Primary)</text>
    </g>

    <!-- Tag 2: AWS -->
    <g transform="translate(130, 0)">
      <rect width="110" height="28" rx="6" fill="#1E293B" stroke="#FF9900" stroke-width="1.2" />
      <text x="55" y="18" fill="#E2E8F0" class="font-main badge-text" text-anchor="middle">AWS Hands-on</text>
    </g>

    <!-- Tag 3: Terraform -->
    <g transform="translate(250, 0)">
      <rect width="125" height="28" rx="6" fill="#1E293B" stroke="#844FBA" stroke-width="1.2" />
      <text x="62" y="18" fill="#E2E8F0" class="font-main badge-text" text-anchor="middle">Terraform (IaC)</text>
    </g>

    <!-- Tag 4: Kubernetes -->
    <g transform="translate(385, 0)">
      <rect width="105" height="28" rx="6" fill="#1E293B" stroke="#326CE5" stroke-width="1.2" />
      <text x="52" y="18" fill="#E2E8F0" class="font-main badge-text" text-anchor="middle">AKS / K8s</text>
    </g>

    <!-- Tag 5: DevSecOps -->
    <g transform="translate(500, 0)">
      <rect width="120" height="28" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.2" />
      <text x="60" y="18" fill="#E2E8F0" class="font-main badge-text" text-anchor="middle">DevSecOps</text>
    </g>
  </g>

  <!-- Bottom Metric Strip -->
  <g transform="translate(60, 280)">
    <!-- Metric Card Background -->
    <rect width="560" height="66" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />

    <!-- Metric 1 -->
    <g transform="translate(25, 20)">
      <text x="0" y="16" fill="#38BDF8" class="font-main metric-value">15+ Yrs</text>
      <text x="0" y="34" class="font-main metric-label">IT &amp; Telecom Backbone</text>
    </g>

    <!-- Divider 1 -->
    <line x1="150" y1="12" x2="150" y2="54" stroke="#334155" stroke-width="1" />

    <!-- Metric 2 -->
    <g transform="translate(170, 20)">
      <text x="0" y="16" fill="#10B981" class="font-main metric-value">6+ Yrs</text>
      <text x="0" y="34" class="font-main metric-label">Enterprise Cloud</text>
    </g>

    <!-- Divider 2 -->
    <line x1="285" y1="12" x2="285" y2="54" stroke="#334155" stroke-width="1" />

    <!-- Metric 3 -->
    <g transform="translate(305, 20)">
      <text x="0" y="16" fill="#F59E0B" class="font-main metric-value">-60%</text>
      <text x="0" y="34" class="font-main metric-label">IaC Provisioning Time</text>
    </g>

    <!-- Divider 3 -->
    <line x1="435" y1="12" x2="435" y2="54" stroke="#334155" stroke-width="1" />

    <!-- Metric 4 -->
    <g transform="translate(455, 20)">
      <text x="0" y="16" fill="#A855F7" class="font-main metric-value">98%+ SLA</text>
      <text x="0" y="34" class="font-main metric-label">Zero-Downtime HA/DR</text>
    </g>
  </g>


  <!-- ================= RIGHT COLUMN: ARCHITECTURAL DIAGRAM GRAPHIC ================= -->
  <g transform="translate(730, 40)">
    <!-- Right Enclosing Card -->
    <rect width="410" height="305" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />

    <!-- Top Card Bar -->
    <rect width="410" height="38" rx="14" fill="#1E293B" fill-opacity="0.6" />
    <circle cx="24" cy="19" r="5" fill="#EF4444" />
    <circle cx="40" cy="19" r="5" fill="#F59E0B" />
    <circle cx="56" cy="19" r="5" fill="#10B981" />
    <text x="205" y="24" fill="#94A3B8" class="font-main badge-text" text-anchor="middle">ENTERPRISE CLOUD ARCHITECTURE TOPOLOGY</text>

    <!-- Central Hub Node (Azure Firewall & ExpressRoute) -->
    <g transform="translate(205, 120)">
      <!-- Pulsing Outer Ring -->
      <circle cx="0" cy="0" r="38" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />
      <circle cx="0" cy="0" r="30" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2" />
      <!-- Cloud Icon SVG inside Hub -->
      <path d="M-10 4 C-14 4 -16 1 -16 -2 C-16 -6 -13 -8 -9 -8 C-8 -13 -3 -15 2 -14 C6 -13 9 -10 9 -6 C13 -6 16 -3 16 1 C16 5 13 8 9 8 L-10 8 Z" fill="#38BDF8" />
      <text x="0" y="24" fill="#E2E8F0" class="font-main" font-size="10px" font-weight="700" text-anchor="middle">SECURE HUB</text>
    </g>

    <!-- Spoke 1: AKS & Containers (Top Left) -->
    <g transform="translate(85, 80)">
      <line x1="25" y1="15" x2="90" y2="35" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.7" />
      <circle cx="0" cy="0" r="24" fill="#1E293B" stroke="#326CE5" stroke-width="1.5" />
      <!-- Hexagon / K8s -->
      <polygon points="0,-10 9,-5 9,5 0,10 -9,5 -9,-5" fill="#326CE5" opacity="0.8" />
      <text x="0" y="18" fill="#94A3B8" class="font-main" font-size="9px" font-weight="600" text-anchor="middle">AKS SPOKE</text>
    </g>

    <!-- Spoke 2: PaaS & SQL (Top Right) -->
    <g transform="translate(325, 80)">
      <line x1="-25" y1="15" x2="-90" y2="35" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.7" />
      <circle cx="0" cy="0" r="24" fill="#1E293B" stroke="#0078D4" stroke-width="1.5" />
      <!-- Database cylinder -->
      <ellipse cx="0" cy="-4" rx="8" ry="3" fill="#0078D4" />
      <path d="M-8 -4 L-8 4 C-8 6 8 6 8 4 L8 -4 Z" fill="#0078D4" opacity="0.8" />
      <text x="0" y="18" fill="#94A3B8" class="font-main" font-size="9px" font-weight="600" text-anchor="middle">PAAS SPOKE</text>
    </g>

    <!-- Spoke 3: DevSecOps CI/CD (Bottom Left) -->
    <g transform="translate(85, 220)">
      <line x1="25" y1="-15" x2="90" y2="-70" stroke="#10B981" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.7" />
      <circle cx="0" cy="0" r="24" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
      <!-- Pipeline Infinity / Check icon -->
      <circle cx="0" cy="0" r="6" fill="#10B981" />
      <text x="0" y="18" fill="#94A3B8" class="font-main" font-size="9px" font-weight="600" text-anchor="middle">DEVSECOPS</text>
    </g>

    <!-- Spoke 4: On-Premises ExpressRoute (Bottom Right) -->
    <g transform="translate(325, 220)">
      <line x1="-25" y1="-15" x2="-90" y2="-70" stroke="#FF9900" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.7" />
      <circle cx="0" cy="0" r="24" fill="#1E293B" stroke="#FF9900" stroke-width="1.5" />
      <!-- Server Rack -->
      <rect x="-8" y="-7" width="16" height="14" rx="2" fill="#FF9900" opacity="0.8" />
      <text x="0" y="18" fill="#94A3B8" class="font-main" font-size="9px" font-weight="600" text-anchor="middle">EXPRESSROUTE</text>
    </g>

    <!-- Bottom Status Pill in Right Card -->
    <g transform="translate(45, 265)">
      <rect width="320" height="24" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="12" r="4" fill="#10B981" />
      <text x="28" y="16" fill="#CBD5E1" class="font-main" font-size="10px" font-weight="600">ZERO TRUST PERIMETER • 98%+ HIGH AVAILABILITY</text>
    </g>
  </g>
</svg>
